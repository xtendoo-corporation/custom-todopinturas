# Ajustes del filtro pdf2escpos8 (se instala en /etc/todopintura-printer.conf).
# Se leen en cada impresión: no hace falta reiniciar CUPS al cambiarlos.

# text  = el ticket se imprime como TEXTO nativo de la impresora (nítido, rápido, sin líneas blancas).
#         Usa la fuente grande (33 columnas) si el ticket cabe, o la pequeña (44 columnas).
# image = imagen en franjas de 8 puntos (valores width/pitch/overlap/rowdots/threshold de abajo).
# En modo text, si el PDF no se puede leer como texto se imprime como imagen automáticamente.
mode=text

# Página de códigos de la impresora para acentos, ñ, º y € (19 = CP858). Si salen caracteres
# raros en los acentos, probar con 16 (CP1252) o 2 (CP850).
codepage=19

# Puntos útiles de la impresora. En la TM-T88IV de pruebas: 400 se ve entero y 416 se corta
# por la derecha. Si en otra tienda se corta el borde derecho, bajar (384, 368...).
width=400

# --- Solo modo image ---
# Valor de ESC 3 entre franjas. Con overlap=1 el avance debe ser de 7 filas (~14 puntos): 12.
pitch=12
# Filas de imagen que se repiten entre franjas consecutivas (cubren la unión entre franjas).
overlap=1
# Puntos reales de papel que ocupa cada fila de imagen (~100 dpi vertical con 2).
rowdots=2
# Umbral blanco/negro (0-255). Más alto = trazo más grueso/oscuro.
threshold=165
